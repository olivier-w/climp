name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          outdir="dist/climp_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}"
          mkdir -p "$outdir"
          out="$outdir/climp"
          if [ "$TARGET_OS" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o "$out" .

      - name: Create tar.gz archive
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf "climp_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" "climp_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}"

      - name: Verify binary version
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/climp_${RELEASE_TAG}_${TARGET_OS}_${TARGET_ARCH}/climp"
          actual="$("$out" --version)"
          expected="climp ${RELEASE_TAG}"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected version output: $actual"
            echo "expected: $expected"
            exit 1
          fi

      - name: Create zip archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/climp_${env:RELEASE_TAG}_${env:TARGET_OS}_${env:TARGET_ARCH}/*" -DestinationPath "dist/climp_${env:RELEASE_TAG}_${env:TARGET_OS}_${env:TARGET_ARCH}.zip"

      - name: Verify binary version
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $out = "dist/climp_${env:RELEASE_TAG}_${env:TARGET_OS}_${env:TARGET_ARCH}/climp.exe"
          $actual = & $out --version
          $expected = "climp ${env:RELEASE_TAG}"
          if ($actual -ne $expected) {
            Write-Host "unexpected version output: $actual"
            Write-Host "expected: $expected"
            exit 1
          }

      - name: Upload tar artifact
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/climp_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload zip artifact
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/climp_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Prepare draft release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Validate expected archives
        run: |
          set -euo pipefail
          expected=(
            "dist/linux-amd64/climp_${RELEASE_TAG}_linux_amd64.tar.gz"
            "dist/linux-arm64/climp_${RELEASE_TAG}_linux_arm64.tar.gz"
            "dist/darwin-amd64/climp_${RELEASE_TAG}_darwin_amd64.tar.gz"
            "dist/darwin-arm64/climp_${RELEASE_TAG}_darwin_arm64.tar.gz"
            "dist/windows-amd64/climp_${RELEASE_TAG}_windows_amd64.zip"
          )

          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing expected release archives:"
            printf ' - %s\n' "${missing[@]}"
            echo "Available files:"
            find dist -type f | sed 's/^/ - /'
            exit 1
          fi

      - name: Upload archives to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "dist/linux-amd64/climp_${RELEASE_TAG}_linux_amd64.tar.gz"
            "dist/linux-arm64/climp_${RELEASE_TAG}_linux_arm64.tar.gz"
            "dist/darwin-amd64/climp_${RELEASE_TAG}_darwin_amd64.tar.gz"
            "dist/darwin-arm64/climp_${RELEASE_TAG}_darwin_arm64.tar.gz"
            "dist/windows-amd64/climp_${RELEASE_TAG}_windows_amd64.zip"
          )

          if draft=$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" != "true" ]; then
              echo "Refusing to replace assets on a published release"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$RELEASE_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$RELEASE_REPOSITORY" --draft --generate-notes --verify-tag
          fi
